<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The same mark used in the nav: a filled square, rotated 45°.
       Reads as a status indicator / instrument marker rather than a logo. -->
  <rect width="32" height="32" fill="none" />
  <rect x="8" y="8" width="16" height="16" fill="#0f6a60" transform="rotate(45 16 16)" />
</svg>
