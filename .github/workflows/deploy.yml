name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  # Weekly rebuild so time-derived values stay current without a commit.
  # The hero's "Engineering — N yrs" is computed from a date in site.ts, so a
  # site that is only built on push would still claim 15 years well into the
  # sixteenth. Runs Mondays at 06:00 UTC.
  #
  # Note: GitHub disables scheduled workflows on public repos after 60 days
  # with no repository activity. If the schedule stops firing, push any commit
  # or re-enable it from the Actions tab.
  schedule:
    - cron: '0 6 * * 1'

  # Allows a manual run from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions required to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, but only queue one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
